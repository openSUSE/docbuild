# log-level(int): Set the logging level for the application.
log-level = 2

# logging(dict): Configure logging settings, such as log file paths, formats, and handlers.
logging = {}

# max_workers(str): Configure the maximum number of worker processes for parallel tasks. Use "half" to set it to half of the available CPU cores.
max_workers = "half"

# theme(table): Configure Rich terminal output styling and color palettes.
[theme]
# preset(str): Base palette optimized for your terminal background.
# Supported values: "dark" (default, for dark terminals) or "light" (for light terminals).
preset = "dark"

# Individual style overrides:
# Styles can be defined as string expressions (e.g., "bold cyan", "italic green on black",
# "#30ba78") or as structured sub-tables with attributes (color, bgcolor, bold, italic).
# Any omitted style inherits the active preset default.

