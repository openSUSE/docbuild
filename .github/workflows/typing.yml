---
name: Typing
on:
  pull_request:
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'pyrightconfig.json'
      - '.github/workflows/typing.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'pyrightconfig.json'
      - '.github/workflows/typing.yml'

permissions:
  contents: read

jobs:
  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group typing

      - name: Run Pyright
        run: uv run pyright
