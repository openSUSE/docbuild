name: Changelog Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check-fragment:
    name: Verify Newsfragment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for bypass label
        id: bypass
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          if [[ "$LABELS" == *"skip-changelog"* ]]; then
            echo "Bypass label found. Skipping check."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for new fragments in changelog.d
        if: steps.bypass.outputs.skip == 'false'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Fetch the target branch to compare against
          git fetch origin ${{ github.base_ref }}
          
          # Find any .rst files added or modified in changelog.d/
          CHANGELOG_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep "^changelog\.d/.*\.rst$" || true)

          if [ -z "$CHANGELOG_FILES" ]; then
            echo "::error title=Missing Changelog Fragment::No newsfragment found in the 'changelog.d/' directory! Please add one or add the 'skip-changelog' label to this PR."
            exit 1
          fi

          # Extract valid fragment types from towncrier.toml
          VALID_TYPES=$(python3 << 'EOF'
          import tomllib
          with open('towncrier.toml', 'rb') as f:
              config = tomllib.load(f)
          # Extract all fragment type keys from [tool.towncrier.fragment.*]
          types = config['tool']['towncrier']['fragment'].keys()
          print('|'.join(sorted(types)))
          EOF
          )

          # Validate that the filename matches the PR number or starts with +
          VALID_FRAGMENT=false
          for file in $CHANGELOG_FILES; do
            # Extract the filename without path
            filename=$(basename "$file")

            # Check if it matches the pattern: PR_NUMBER.TYPE.rst or +description.TYPE.rst
            if [[ "$filename" =~ ^${PR_NUMBER}\.(${VALID_TYPES})\.rst$ ]] || [[ "$filename" =~ ^\+[a-z0-9\-]+\.(${VALID_TYPES})\.rst$ ]]; then
              VALID_FRAGMENT=true
              echo "✅ Valid newsfragment: $file"
            else
              echo "❌ Invalid newsfragment: $file"
              echo "   Expected format: '${PR_NUMBER}.<type>.rst' or '+<description>.<type>.rst'"
              echo "   Valid types: $VALID_TYPES"
            fi
          done

          if [ "$VALID_FRAGMENT" = false ]; then
            echo "::error title=Invalid Changelog Fragment::The newsfragment filename does not match the PR number #$PR_NUMBER or follow the '+description' format. Valid types: $VALID_TYPES. Or add the 'skip-changelog' label to this PR."
            exit 1
          fi
